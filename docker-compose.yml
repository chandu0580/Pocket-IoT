version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: cy023-backend
    env_file:
      - ./backend/.env.example
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000
    container_name: cy023-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

